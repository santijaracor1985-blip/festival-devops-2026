name: Verificar Proyecto

on:
  push:
    branches:
      - main

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar README.md
        run: test -f README.md

      - name: Validación completada
        run: echo "Proyecto validado correctamente"
