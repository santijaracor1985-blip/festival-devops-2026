name: Verificar Proyecto

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar index.html
        run: test -f index.html

      - name: Verificar style.css
        run: test -f css/style.css

      - name: Verificar script.js
        run: test -f js/script.js

      - name: Verificar README
        run: test -f README.md
